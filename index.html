<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PTA SINSS Clinical Reasoning Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ------------------------------
   GLOBAL STYLES
--------------------------------*/
body {
    margin: 0;
    padding: 0;
    background: #f7f7f4;
    font-family: "Segoe UI", sans-serif;
    color: #0a3d3f;
}

header {
    background: #0a3d3f;
    color: white;
    padding: 15px 20px;
    font-size: 1.4rem;
    font-family: Georgia, serif;
}

.container {
    display: flex;
    flex-direction: row;
    padding: 20px;
    gap: 20px;
}

@media (max-width: 900px) {
    .container {
        flex-direction: column;
    }
}

.main {
    flex: 3;
}

.sidebar {
    flex: 1;
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    margin-bottom: 20px;
}

h2 {
    font-family: Georgia, serif;
    margin-top: 0;
}

h3 {
    font-family: Georgia, serif;
}

label {
    font-weight: bold;
}

select, button, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 6px;
    border: 1px solid #b0b0b0;
    font-size: 1rem;
}

button {
    background: #0a3d3f;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0c5052;
}

.navbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.nav-item {
    padding: 10px 15px;
    background: #e0e0dd;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.nav-item.active {
    background: #0a3d3f;
    color: white;
}

.interview-question {
    padding: 10px;
    border-radius: 6px;
    background: #eef5f5;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
}

/* New style for selected questions */
.interview-question.selected {
    background: #cdeeea;
    color: #053737;
    font-weight: 700;
}

.interview-response {
    background: #ffffff;
    border-left: 4px solid #0a3d3f;
    padding: 10px;
    margin-bottom: 15px;
}

.sinss-select {
    margin-bottom: 15px;
}

.intervention-item {
    padding: 10px;
    background: #eef5f5;
    border-radius: 6px;
    margin-bottom: 10px;
}

.result-correct {
    color: green;
    font-weight: bold;
}

.result-incorrect {
    color: red;
    font-weight: bold;
}

.debrief-box {
    background: #ffffff;
    border-left: 4px solid #0a3d3f;
    padding: 15px;
    margin-top: 20px;
    border-radius: 6px;
}

.sinss-feedback-item {
    padding: 10px;
    border-radius: 6px;
    background: #fafafa;
    margin-bottom: 8px;
    border: 1px solid #e6e6e6;
}

</style>

</head>
<body>

<header>PTA SINSS Clinical Reasoning Simulation</header>

<div style="padding: 20px;">
    <label>Select Case:</label>
    <select id="caseSelect"></select>
</div>

<div class="container">
    <div class="main">
        <div class="navbar">
            <div class="nav-item active" id="nav-plan">PLAN OF CARE</div>
            <div class="nav-item" id="nav-interview">INTERVIEW</div>
            <div class="nav-item" id="nav-sinss">CLASSIFY — SINSS</div>
            <div class="nav-item" id="nav-interventions">INTERVENTIONS</div>
        </div>

        <div id="content-area"></div>
    </div>

    <div class="sidebar">
        <h3>Patient Summary</h3>
        <div id="sidebar-content"></div>
        <!-- Subjective will be injected into the sidebar by updateSidebar() -->
    </div>
</div>

<script>
/* ---------------------------------------------------------
   CASE DATA
--------------------------------------------------------- */

const cases = [
{
    id: "case1",
    patient: {
        name: "Tara Molina",
        age: 24,
        occupation: "Recreational basketball player",
        diagnosis: "Acute lateral ankle sprain",
        timeSince: "6 days",
        mechanism: "Inversion injury during a Sunday league basketball game."
    },
    planOfCare: {
        impairments: [
            "Pain",
            "Swelling",
            "Limited weight-bearing tolerance",
            "Reduced ankle ROM",
            "Reduced dynamic balance"
        ],
        goals: [
            "Walk without pain",
            "Return to recreational basketball",
            "Restore strength and balance"
        ],
        originalPlan: [
            "Cryotherapy/compression/elevation as needed",
            "Pain-free ROM",
            "Progressive resisted strengthening",
            "Balance training",
            "Progress to hopping, cutting, and agility drills"
        ]
    },
    interview: [
        { q: "How would you rate your pain right now?", a: "About 4/10 at rest." },
        { q: "What is your pain at its worst?", a: "Around 6/10 when I put weight on it." },
        { q: "What activities aggravate your symptoms?", a: "Walking more than a few minutes increases pain to 6/10 and it stays aggravated for hours." },
        { q: "How long do symptoms take to settle?", a: "Several hours after aggravation." },
        { q: "Describe your symptoms.", a: "Localized aching around the outside of my ankle." },
        { q: "Any numbness or tingling?", a: "No." },
        { q: "Do symptoms travel?", a: "No, just around the ankle." },
        { q: "When did this begin?", a: "Six days ago." },
        { q: "How did the injury occur?", a: "I rolled my ankle playing basketball." },
        { q: "Compared with last visit?", a: "Worse — I tried jogging and it swelled up more." }
    ],
    sinss: {
        correct: {
            severity: "Moderate",
            irritability: "High",
            nature: "Nociceptive",
            stage: "Acute",
            stability: "Worsening"
        },
        explanations: {
            severity: "Pain 4/10 at rest and 6/10 with weight bearing indicates moderate severity.",
            irritability: "Symptoms are easily aggravated and remain elevated for hours — high irritability.",
            nature: "Localized aching without numbness/tingling indicates nociceptive pain.",
            stage: "Symptoms began 6 days ago — acute stage.",
            stability: "Symptoms worsened after jogging — worsening stability."
        }
    },
    interventions: [
        { name: "Cryotherapy", correct: true, rationale: "Appropriate for symptom management in acute worsening status." },
        { name: "Compression/elevation education", correct: true, rationale: "Helps manage swelling and pain." },
        { name: "Pain-free ROM", correct: true, rationale: "Safe mobility without aggravation." },
        { name: "Low-load isometrics", correct: true, rationale: "Appropriate early strengthening without high load." },
        { name: "High-load resisted strengthening", correct: false, rationale: "Too aggressive for high irritability and worsening symptoms." },
        { name: "Advanced unstable-surface balance", correct: false, rationale: "Not appropriate until symptoms stabilize." },
        { name: "Plyometrics", correct: false, rationale: "Contraindicated due to worsening status." },
        { name: "Hopping/cutting/agility drills", correct: false, rationale: "Not appropriate until irritability decreases." },
        { name: "Activity modification education", correct: true, rationale: "Important due to recent aggravation." },
        { name: "Notify supervising PT", correct: true, rationale: "Required due to worsening status." }
    ],
    debrief: "The original Plan of Care included progressive strengthening and agility drills. However, the interview revealed worsening symptoms and high irritability after jogging. Therefore, p[...]"
},

{
    id: "case2",
    patient: {
        name: "James Carter",
        age: 59,
        occupation: "Warehouse worker",
        diagnosis: "Subacute mechanical low back pain",
        timeSince: "3 weeks",
        mechanism: "Gradual onset related to lifting at work."
    },
    planOfCare: {
        impairments: [
            "Limited lumbar flexion",
            "Pain with extension",
            "Reduced trunk endurance",
            "Difficulty lifting",
            "Difficulty with prolonged sitting"
        ],
        goals: [
            "Improve lumbar mobility",
            "Improve trunk endurance",
            "Return to lifting 40-lb boxes"
        ],
        originalPlan: [
            "Heat as needed",
            "Lumbar mobility exercises",
            "Core stabilization",
            "Progressive resisted lifting",
            "Body mechanics education"
        ]
    },
    interview: [
        { q: "Current pain level?", a: "About 2/10." },
        { q: "Worst pain?", a: "Around 4/10." },
        { q: "How long do symptoms take to settle?", a: "About 10 minutes." },
        { q: "Recent flare?", a: "No significant flare recently." },
        { q: "What improves symptoms?", a: "Walking helps." },
        { q: "Any numbness or tingling?", a: "No." },
        { q: "Any leg pain?", a: "No." },
        { q: "How are symptoms changing?", a: "Improving." },
        { q: "Sitting tolerance?", a: "Getting better." },
        { q: "Movement tolerance?", a: "Improving." },
        { q: "When did this begin?", a: "About 3 weeks ago." }
    ],
    sinss: {
        correct: {
            severity: "Mild",
            irritability: "Low",
            nature: "Nociceptive",
            stage: "Subacute",
            stability: "Improving"
        },
        explanations: {
            severity: "Pain 2/10 currently and 4/10 worst indicates mild severity.",
            irritability: "Symptoms settle within 10 minutes — low irritability.",
            nature: "Mechanical low back pain without numbness/tingling is nociceptive.",
            stage: "Symptoms began 3 weeks ago — subacute stage.",
            stability: "Symptoms improving — stability improving."
        }
    },
    interventions: [
        { name: "Progressing core stabilization", correct: true, rationale: "Appropriate due to improving status and low irritability." },
        { name: "Progressive therapeutic exercise", correct: true, rationale: "Supports functional goals." },
        { name: "Graded functional lifting", correct: true, rationale: "Matches occupational goals." },
        { name: "Body mechanics training", correct: true, rationale: "Important for warehouse work." },
        { name: "Progressive walking", correct: true, rationale: "Walking improves symptoms." },
        { name: "Manual resistance", correct: true, rationale: "Appropriate for subacute improving status." },
        { name: "Avoiding all strengthening", correct: false, rationale: "Inappropriate — patient should progress." },
        { name: "Waiting until pain-free before exercising", correct: false, rationale: "Not necessary — mild symptoms allow progression." },
        { name: "Maximal-effort lifting", correct: false, rationale: "Too aggressive at this stage." },
        { name: "Treating exclusively with heat", correct: false, rationale: "Does not address functional goals." }
    ],
    debrief: "The patient demonstrates mild symptoms, low irritability, and improving stability. The original Plan of Care supports progression, and the patient's current status confirms readines[...]"
}
];

/* ---------------------------------------------------------
   APPLICATION STATE
--------------------------------------------------------- */

let currentCase = null;
let interviewResponses = [];
let sinssSelections = {
    severity: null,
    irritability: null,
    nature: null,
    stage: null,
    stability: null
};
let interventionSelections = {};

/* ---------------------------------------------------------
   INITIALIZATION
--------------------------------------------------------- */

function init() {
    const select = document.getElementById("caseSelect");
    select.innerHTML = ""; // Clear existing options

    cases.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = `${c.patient.name} — ${c.patient.diagnosis}`;
        select.appendChild(opt);
    });

    select.addEventListener("change", () => loadCase(select.value));

    loadCase(cases[0].id);
}

function loadCase(caseId) {
    currentCase = cases.find(c => c.id === caseId);
    interviewResponses = [];
    sinssSelections = {
        severity: null,
        irritability: null,
        nature: null,
        stage: null,
        stability: null
    };
    interventionSelections = {};

    updateSidebar();
    showPlanOfCare();
    setActiveNav("nav-plan");
}

/* ---------------------------------------------------------
   SIDEBAR
--------------------------------------------------------- */

function updateSidebar() {
    const sb = document.getElementById("sidebar-content");
    // Basic patient info and SINSS
    let html = `
        <strong>Name:</strong> ${currentCase.patient.name}<br>
        <strong>Age:</strong> ${currentCase.patient.age}<br>
        <strong>Activity:</strong> ${currentCase.patient.occupation}<br>
        <strong>Diagnosis:</strong> ${currentCase.patient.diagnosis}<br>
        <strong>Time Since Onset:</strong> ${currentCase.patient.timeSince}<br>
        <strong>Current SINSS:</strong><br>
        Severity: ${sinssSelections.severity || "-"}<br>
        Irritability: ${sinssSelections.irritability || "-"}<br>
        Nature: ${sinssSelections.nature || "-"}<br>
        Stage: ${sinssSelections.stage || "-"}<br>
        Stability: ${sinssSelections.stability || "-"}<br>
    `;

    // Add Subjective area (selected interview Q/A)
    html += `<h3 style="margin-top:12px;">Subjective</h3>`;
    if (interviewResponses && interviewResponses.some(Boolean)) {
        html += `<div id="subjective-content">`;
        interviewResponses.forEach((resp, i) => {
            if (resp) {
                const q = currentCase.interview[i].q;
                html += `<div class="interview-response"><strong>${q}</strong><br>${resp}</div>`;
            }
        });
        html += `</div>`;
    } else {
        html += `<div id="subjective-content"><em>No subjective notes yet. Ask questions from the Interview tab.</em></div>`;
    }

    sb.innerHTML = html;
}

/* ---------------------------------------------------------
   NAVIGATION
--------------------------------------------------------- */

document.getElementById("nav-plan").onclick = () => { showPlanOfCare(); setActiveNav("nav-plan"); };
document.getElementById("nav-interview").onclick = () => { showInterview(); setActiveNav("nav-interview"); };
document.getElementById("nav-sinss").onclick = () => { showSINSS(); setActiveNav("nav-sinss"); };
document.getElementById("nav-interventions").onclick = () => { showInterventions(); setActiveNav("nav-interventions"); };

function setActiveNav(id) {
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* ---------------------------------------------------------
   PHASE 1 — PLAN OF CARE
--------------------------------------------------------- */

function showPlanOfCare() {
    const c = currentCase;
    const area = document.getElementById("content-area");

    area.innerHTML = `
        <div class="card">
            <h2>Plan of Care</h2>
            <p><strong>Patient:</strong> ${c.patient.name}, ${c.patient.age}</p>
            <p><strong>Diagnosis:</strong> ${c.patient.diagnosis}</p>
            <p><strong>Mechanism:</strong> ${c.patient.mechanism}</p>

            <h3>Impairments</h3>
            <ul>${c.planOfCare.impairments.map(i => `<li>${i}</li>`).join("")}</ul>

            <h3>Goals</h3>
            <ul>${c.planOfCare.goals.map(i => `<li>${i}</li>`).join("")}</ul>

            <h3>Original Plan of Care</h3>
            <ul>${c.planOfCare.originalPlan.map(i => `<li>${i}</li>`).join("")}</ul>

            <button onclick="showInterview(); setActiveNav('nav-interview');">Interview the Patient →</button>
        </div>
    `;
}

/* ---------------------------------------------------------
   PHASE 2 — INTERVIEW
--------------------------------------------------------- */

function showInterview() {
    const area = document.getElementById("content-area");
    const c = currentCase;

    let html = `
        <div class="card">
            <h2>Patient Interview</h2>
            <p>Select questions to ask the patient.</p>
    `;

    c.interview.forEach((item, index) => {
        html += `
            <div class="interview-question" onclick="showInterviewResponse(${index})">
                ${item.q}
            </div>
        `;
    });

    html += `
        <h3>Your Notes</h3>
        <textarea placeholder="Document your notes here (optional)."></textarea>
        <br><br>
        <button onclick="showSINSS(); setActiveNav('nav-sinss');">Proceed to SINSS Classification →</button>
        </div>
    `;

    area.innerHTML = html;

    // Re-apply selected styling for questions that are already answered
    setTimeout(() => {
        const questions = document.querySelectorAll(".interview-question");
        questions.forEach((el, i) => {
            if (interviewResponses[i]) el.classList.add("selected");
        });
    }, 0);
}

function showInterviewResponse(index) {
    const item = currentCase.interview[index];
    // Save the answer so it can be displayed in the sidebar Subjective section
    interviewResponses[index] = item.a;

    // Visually mark the selected question
    const questions = document.querySelectorAll(".interview-question");
    if (questions && questions[index]) {
        questions[index].classList.add("selected");
    }

    // Update the sidebar to show Subjective answers
    updateSidebar();
}

/* ---------------------------------------------------------
   PHASE 3 — SINSS CLASSIFICATION (implemented)
--------------------------------------------------------- */

function showSINSS() {
    const area = document.getElementById("content-area");
    const c = currentCase;

    // Options for each SINSS domain
    const severityOptions = ["-", "Minimal", "Mild", "Moderate", "Severe"];
    const irritabilityOptions = ["-", "Low", "Moderate", "High"];
    const natureOptions = ["-", "Nociceptive", "Neuropathic", "Mixed"];
    const stageOptions = ["-", "Acute", "Subacute", "Chronic"];
    const stabilityOptions = ["-", "Improving", "Unchanged", "Worsening"];

    function makeSelect(id, options, selected) {
        return `<label for="${id}">${id.replace('sinss-','').charAt(0).toUpperCase()+id.replace('sinss-','').slice(1)}:</label>` +
               `<select id="${id}">${options.map(o => `<option value="${o}" ${o===selected? 'selected':''}>${o}</option>`).join('')}</select>`;
    }

    area.innerHTML = `
        <div class="card">
            <h2>Classify — SINSS</h2>
            <p>Select the best classification for each SINSS domain based on your interview and findings.</p>

            <div class="sinss-select">${makeSelect('sinss-severity', severityOptions, sinssSelections.severity || '-')}</div>
            <div class="sinss-select">${makeSelect('sinss-irritability', irritabilityOptions, sinssSelections.irritability || '-')}</div>
            <div class="sinss-select">${makeSelect('sinss-nature', natureOptions, sinssSelections.nature || '-')}</div>
            <div class="sinss-select">${makeSelect('sinss-stage', stageOptions, sinssSelections.stage || '-')}</div>
            <div class="sinss-select">${makeSelect('sinss-stability', stabilityOptions, sinssSelections.stability || '-')}</div>

            <button id="save-sinss">Save SINSS & Check</button>
            <button id="clear-sinss" style="margin-top:8px;background:#7a7a7a">Clear SINSS</button>

            <div id="sinss-feedback" style="margin-top:12px"></div>

            <br>
            <button onclick="showInterventions(); setActiveNav('nav-interventions');">Proceed to Interventions →</button>
        </div>
    `;

    document.getElementById('save-sinss').onclick = () => {
        // Read values
        const sev = document.getElementById('sinss-severity').value;
        const irr = document.getElementById('sinss-irritability').value;
        const nat = document.getElementById('sinss-nature').value;
        const stg = document.getElementById('sinss-stage').value;
        const stb = document.getElementById('sinss-stability').value;

        sinssSelections.severity = sev === '-' ? null : sev;
        sinssSelections.irritability = irr === '-' ? null : irr;
        sinssSelections.nature = nat === '-' ? null : nat;
        sinssSelections.stage = stg === '-' ? null : stg;
        sinssSelections.stability = stb === '-' ? null : stb;

        updateSidebar();
        renderSINSSFeedback();
    };

    document.getElementById('clear-sinss').onclick = () => {
        sinssSelections = {severity:null,irritability:null,nature:null,stage:null,stability:null};
        updateSidebar();
        // Reset selects in UI
        ['sinss-severity','sinss-irritability','sinss-nature','sinss-stage','sinss-stability'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '-';
        });
        document.getElementById('sinss-feedback').innerHTML = '';
    };

    function renderSINSSFeedback() {
        const fb = document.getElementById('sinss-feedback');
        const correct = c.sinss && c.sinss.correct ? c.sinss.correct : {};
        const explanations = c.sinss && c.sinss.explanations ? c.sinss.explanations : {};

        const domains = ['severity','irritability','nature','stage','stability'];
        let html = '';
        domains.forEach(d => {
            const userVal = sinssSelections[d] || '-';
            const correctVal = correct[d] || '-';
            const isCorrect = userVal !== '-' && correctVal !== '-' && userVal === correctVal;
            html += `<div class="sinss-feedback-item">` +
                    `<strong>${d.charAt(0).toUpperCase()+d.slice(1)}:</strong> Your selection: <em>${userVal}</em><br>` +
                    (userVal === '-' ? `<span style="color:#7a7a7a">No selection</span>` : isCorrect ? `<span class="result-correct">Correct</span>` : `<span class="result-incorrect">Incorrect (Expected: ${correctVal})</span>`) +
                    (explanations[d] ? `<div style="margin-top:6px;color:#444">${explanations[d]}</div>` : '') +
                    `</div>`;
        });

        fb.innerHTML = html;
    }
}

/* ---------------------------------------------------------
   (PLACEHOLDERS for remaining phases — unchanged)
--------------------------------------------------------- */

function showInterventions(){
    const area = document.getElementById("content-area");
    const c = currentCase;
    area.innerHTML = `
        <div class="card">
            <h2>Interventions</h2>
            <p>Placeholder interventions UI (not implemented in this edit).</p>
        </div>
    `;
}

// Initialize the application when the page loads
init();
</script>

</body>
</html>
